# À copier dans /etc/nginx/sites-available/vote après remplacement du domaine.
# TLS : sudo certbot --nginx -d vote.example.org
server {
    listen 80;
    listen [::]:80;
    server_name vote.example.org;
    root /var/www/vote/current/public;
    index index.php;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Seul le front controller Laravel est exécutable.
    location ~ \.php$ { return 404; }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        internal;
    }

    # Bloquer fichiers cachés et fichiers de configuration accidentellement publiés.
    location ~ /.(?!well-known).* { deny all; }
    location ~* \.(env|ini|log|sql|bak|dist|ya?ml)$ { deny all; }

    client_max_body_size 10m;
    access_log /var/log/nginx/vote_access.log;
    error_log /var/log/nginx/vote_error.log warn;
}
